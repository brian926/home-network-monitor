global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    scrape_interval: 30s
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: smokeping
    scrape_interval: 15s
    static_configs:
      - targets: ["host.docker.internal:9374"]

  - job_name: blackbox_dns
    scrape_interval: 30s
    metrics_path: /probe
    file_sd_configs:
      - files: ["/etc/prometheus/targets/dns.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: host.docker.internal:9115

  - job_name: blackbox_http
    scrape_interval: 60s
    metrics_path: /probe
    file_sd_configs:
      - files: ["/etc/prometheus/targets/http.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: host.docker.internal:9115

  - job_name: mb8611
    scrape_interval: 60s
    static_configs:
      - targets: ["mb8611-exporter:9611"]

  - job_name: pushgateway
    honor_labels: true
    scrape_interval: 30s
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: speedtest
    scrape_interval: 60s
    static_configs:
      - targets: ["speedtest-bridge:9798"]

  - job_name: pihole
    scrape_interval: 30s
    static_configs:
      - targets: ["pihole-exporter:9617"]
