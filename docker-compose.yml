services:
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=8GB
      - --web.enable-lifecycle
      - --web.external-url=http://${PROXY_HOSTNAME:-localhost}/prometheus
      - --web.route-prefix=/
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [monitoring]

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://${PROXY_HOSTNAME:-localhost}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    networks: [monitoring]

  node-exporter:
    image: prom/node-exporter:v1.8.1
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.netdev
    volumes:
      - /:/host:ro,rslave

  smokeping:
    image: quay.io/superq/smokeping-prober:v0.8.1
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
    # Targets come from SMOKEPING_TARGETS in .env (space-separated). String form
    # is deliberate: Compose substitutes the variable, then the value is split
    # into arguments, so the number of targets is not fixed by this file.
    command: --privileged ${SMOKEPING_TARGETS}

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./blackbox:/config:ro
    command:
      - --config.file=/config/blackbox.yml

  mb8611-exporter:
    build: ./exporters/mb8611
    restart: unless-stopped
    environment:
      MB8611_ENABLED: ${MB8611_ENABLED:-true}
      MB8611_HOST: ${MB8611_HOST}
      MB8611_USER: ${MB8611_USER}
      MB8611_PASS: ${MB8611_PASS}
      MB8611_INTERVAL_SECONDS: ${MB8611_INTERVAL_SECONDS:-60}
    networks: [monitoring]

  pushgateway:
    image: prom/pushgateway:v1.9.0
    restart: unless-stopped
    command:
      - --web.external-url=http://${PROXY_HOSTNAME:-localhost}/pushgateway
      - --web.route-prefix=/
    ports:
      - "9091:9091"
    networks: [monitoring]

  bufferbloat:
    build: ./jobs/bufferbloat
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
    environment:
      BUFFERBLOAT_CRON: ${BUFFERBLOAT_CRON:-36 * * * *}
      BUFFERBLOAT_TARGET: ${BUFFERBLOAT_TARGET:-1.1.1.1}
      PUSHGATEWAY_URL: http://localhost:9091

  speedtest-tracker:
    # Deliberately unpinned, unlike every other image here. Upstream persists
    # generated configs in /config and never downgrades them, so a pinned older
    # version breaks against configs written by a newer one.
    # Trade-off: a pull can change the app underneath you. If D3's throughput
    # panel goes empty or wrong after an upgrade, check that the API shape
    # exporters/speedtest_bridge/parser.py expects still holds — see
    # docs/DEPLOYMENT.md section 9.
    image: lscr.io/linuxserver/speedtest-tracker:latest
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      APP_KEY: ${SPEEDTEST_APP_KEY}
      APP_URL: ${SPEEDTEST_APP_URL}
      DB_CONNECTION: sqlite
      SPEEDTEST_SCHEDULE: ${SPEEDTEST_SCHEDULE}
      DISPLAY_TIMEZONE: ${SPEEDTEST_TZ}
    volumes:
      - ./data/speedtest:/config
    ports:
      - "8080:80"
    networks: [monitoring]

  speedtest-bridge:
    build: ./exporters/speedtest_bridge
    restart: unless-stopped
    environment:
      SPEEDTEST_BASE_URL: http://speedtest-tracker:80
      SPEEDTEST_API_TOKEN: ${SPEEDTEST_API_TOKEN}
    depends_on: [speedtest-tracker]
    networks: [monitoring]

  pihole-exporter:
    image: ekofr/pihole-exporter:v1.0.0
    restart: unless-stopped
    environment:
      PIHOLE_PROTOCOL: http
      PIHOLE_HOSTNAME: ${PIHOLE_HOST}
      PIHOLE_PASSWORD: ${PIHOLE_APP_PASSWORD}
      PORT: 9617
    networks: [monitoring]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      PROXY_HOSTNAME: ${PROXY_HOSTNAME:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${PROXY_PORT:-80}:80"
    depends_on: [grafana, prometheus]
    networks: [monitoring]

volumes:
  prometheus-data:
  grafana-data:
  caddy-data:
  caddy-config:

networks:
  monitoring:
